name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: |
          if npm list --depth=0 | grep -q eslint; then
            npm run lint || echo "Linting warnings found"
          else
            echo "No ESLint configured for backend"
          fi

      - name: Run backend tests
        run: |
          if npm list --depth=0 | grep -q jest; then
            npm test -- --coverage
          else
            echo "No Jest configured for backend"
          fi

      - name: Security audit (backend)
        run: npm audit --audit-level=high || echo "Audit completed with warnings"

  # --- FRONTEND CI JOB ---
  frontend:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    needs: backend  # Run only after backend CI succeeds

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: |
          if npm list --depth=0 | grep -q eslint; then
            npm run lint || echo "Linting warnings found"
          else
            echo "No ESLint configured for frontend"
          fi

      - name: Build frontend
        run: npm run build --if-present

      - name: Run frontend tests
        run: |
          if npm list --depth=0 | grep -q jest; then
            npm test -- --coverage
          else
            echo "No Jest configured for frontend"
          fi

  # --- DEPLOYMENT JOB ---
  deploy:
    name: Deploy to Staging/Production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: echo "🚀 Deploying to staging environment..."

      - name: Run integration tests
        run: echo "🧪 Running post-deployment integration tests..."

      - name: Deploy to production
        run: echo "🚀 Deploying to production environment..."
